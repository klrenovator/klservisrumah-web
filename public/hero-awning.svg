<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Awning installation illustration — car porch awning on a Malaysian home">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="aroof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="ahouse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#abg)"/>
  <circle cx="980" cy="110" r="200" fill="#fff" opacity="0.05"/>
  <circle cx="180" cy="540" r="160" fill="#fff" opacity="0.04"/>

  <!-- Sun -->
  <circle cx="990" cy="150" r="52" fill="#FDE68A" opacity="0.9"/>
  <g stroke="#FDE68A" stroke-width="8" stroke-linecap="round" opacity="0.8">
    <line x1="990" y1="62" x2="990" y2="34"/>
    <line x1="1078" y1="150" x2="1106" y2="150"/>
    <line x1="1052" y1="88" x2="1072" y2="68"/>
    <line x1="928" y1="88" x2="908" y2="68"/>
  </g>

  <!-- Rain lines (left of awning) -->
  <g stroke="#E0F2FE" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <line x1="120" y1="150" x2="104" y2="196"/>
    <line x1="175" y1="120" x2="159" y2="166"/>
    <line x1="230" y1="160" x2="214" y2="206"/>
    <line x1="285" y1="125" x2="269" y2="171"/>
  </g>

  <!-- House wall behind -->
  <rect x="140" y="250" width="920" height="300" rx="10" fill="url(#ahouse)" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Door -->
  <rect x="560" y="360" width="90" height="190" rx="6" fill="#075985" opacity="0.55"/>
  <circle cx="636" cy="460" r="5" fill="#BAE6FD"/>
  <!-- Windows -->
  <rect x="300" y="360" width="120" height="110" rx="6" fill="#075985" opacity="0.45"/>
  <line x1="360" y1="360" x2="360" y2="470" stroke="#BAE6FD" stroke-width="4" opacity="0.7"/>
  <line x1="300" y1="415" x2="420" y2="415" stroke="#BAE6FD" stroke-width="4" opacity="0.7"/>
  <rect x="790" y="360" width="120" height="110" rx="6" fill="#075985" opacity="0.45"/>
  <line x1="850" y1="360" x2="850" y2="470" stroke="#BAE6FD" stroke-width="4" opacity="0.7"/>
  <line x1="790" y1="415" x2="910" y2="415" stroke="#BAE6FD" stroke-width="4" opacity="0.7"/>

  <!-- Car porch awning: sloped roof panel -->
  <polygon points="180,300 920,250 920,300 180,350" fill="url(#aroof)" stroke="#fff" stroke-width="4" stroke-opacity="0.8"/>
  <!-- Roof ribs (polycarbonate-style) -->
  <g stroke="#0284C7" stroke-width="3" opacity="0.55">
    <line x1="290" y1="293" x2="290" y2="343"/>
    <line x1="400" y1="286" x2="400" y2="336"/>
    <line x1="510" y1="279" x2="510" y2="329"/>
    <line x1="620" y1="271" x2="620" y2="321"/>
    <line x1="730" y1="264" x2="730" y2="314"/>
    <line x1="840" y1="256" x2="840" y2="306"/>
  </g>
  <!-- Front fascia -->
  <rect x="180" y="338" width="740" height="16" fill="#075985" opacity="0.85"/>

  <!-- Support posts -->
  <rect x="196" y="350" width="18" height="200" rx="4" fill="#fff" opacity="0.85"/>
  <rect x="886" y="300" width="18" height="250" rx="4" fill="#fff" opacity="0.85"/>
  <!-- Wall brackets -->
  <rect x="170" y="330" width="26" height="26" rx="4" fill="#FDE68A" opacity="0.9"/>
  <rect x="908" y="282" width="26" height="26" rx="4" fill="#FDE68A" opacity="0.9"/>

  <!-- Gutter + downpipe (drainage) -->
  <rect x="900" y="296" width="14" height="254" rx="6" fill="#E0F2FE" opacity="0.8"/>
  <path d="M907 548 q0 18 18 18 h26" fill="none" stroke="#E0F2FE" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

  <!-- Ground / floor -->
  <rect x="120" y="550" width="920" height="14" rx="7" fill="#fff" opacity="0.25"/>

  <!-- Car silhouette under porch -->
  <g transform="translate(300, 460)" fill="#075985" opacity="0.5">
    <path d="M20 60 h240 l-18 -34 q-6 -12 -20 -12 h-90 q-14 0 -22 12 z"/>
    <circle cx="70" cy="62" r="18" fill="#0369A1"/>
    <circle cx="210" cy="62" r="18" fill="#0369A1"/>
  </g>

  <!-- Rainwater running off the awning edge (right) -->
  <g stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="920" y1="320" x2="920" y2="366"/>
    <line x1="880" y1="322" x2="880" y2="360"/>
  </g>
</svg>
